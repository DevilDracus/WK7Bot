name: "WK7 Bot"
description: "Discord Bot for Home Assistant integration and RSS feed management."
version: "1.0.61"
slug: "wk7bot"
image: "ghcr.io/devildracus/wk7bot"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - config:rw
  - ssl
options:
  discord_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  steam_api_key: ""
  battlenet_client_id: ""
  battlenet_client_secret: ""
  battlenet_region: "eu"
  battlenet_locale: "de_DE"
  gemini_api_key: ""
  discord_steam_mappings: []
  discord_battlenet_mappings: []
  discord_dm_user_ids: []
  error_notify_user_ids: ["162201162257399808"]
  leipzig_waste_ics_feed_url: ""
  alexa_notification:
    target_user_id: ""
    api_token: ""
    api_secret: ""
    endpoint_url: "https://api.getnotify.me/v1/notify"
  features:
    rss_polling_enabled: true
    home_assistant_notifier_enabled: true
    leipzig_waste_enabled: true
    alexa_notifications_enabled: true
    discord_presence_mqtt_enabled: true
    steam_presence_enabled: true
    battlenet_presence_enabled: true
    food_service_enabled: true
    spontan_treff_enabled: true
    weekend_digest_enabled: true
    dwd_warning_enabled: true
    error_notifications_enabled: true
    mqtt_bot_status_enabled: true
  servers:
    wk7_server_id: "YOUR_WK7_SERVER_ID"
    test_server_id: "YOUR_BOT_TEST_SERVER_ID"
    testing_features: []                           # e.g. [ "dwd_warning", "error_notifications" ]
  dwd_warning:
    postal_code: ""
    latitude: 00.00
    longitude: 00.00
    lead_minutes: 30
    area_names:
      - "City Name"
      - "City"
    events:
      - "STARKREGEN"
      - "HAGEL"
      - "GEWITTER"
      - "STURM"
      - "BÖEN"
      - "BOEEN"
      - "HEAVY_RAIN"
      - "HAIL"
      - "THUNDER"
      - "STORM"
schema:
  discord_token: str
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: str?
  steam_api_key: str?
  battlenet_client_id: str?
  battlenet_client_secret: str?
  battlenet_region: str
  battlenet_locale: str
  gemini_api_key: str?
  discord_steam_mappings:
    - discord_user_id: str
      steam_id: str
  discord_battlenet_mappings:
    - discord_user_id: str
      refresh_token: str
      region: str?
      battle_tag: str?
  discord_dm_user_ids:
    - str
  error_notify_user_ids:
    - str
  leipzig_waste_ics_feed_url: str
  alexa_notification:
    target_user_id: str?
    api_token: str?
    api_secret: str?
    endpoint_url: str?
  features:
    rss_polling_enabled: bool
    home_assistant_notifier_enabled: bool
    leipzig_waste_enabled: bool
    alexa_notifications_enabled: bool
    discord_presence_mqtt_enabled: bool
    steam_presence_enabled: bool
    battlenet_presence_enabled: bool
    food_service_enabled: bool
    spontan_treff_enabled: bool
    weekend_digest_enabled: bool
    dwd_warning_enabled: bool
    error_notifications_enabled: bool
    mqtt_bot_status_enabled: bool
  servers:
    wk7_server_id: str
    test_server_id: str
    testing_features:
      - str
  dwd_warning:
    postal_code: str
    latitude: float
    longitude: float
    lead_minutes: int
    area_names:
      - str
    events:
      - str
hassio_api: true
homeassistant_api: true
hassio_role: "default"