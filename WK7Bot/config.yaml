name: "WK7 Bot"
description: "Discord Bot for Home Assistant integration and RSS feed management."
version: "1.0.50"
slug: "wk7bot"
image: "ghcr.io/devildracus/wk7bot"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - config:rw
  - ssl
options:
  discord_token: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  steam_api_key: ""
  gemini_api_key: ""
  discord_steam_mappings: []
  discord_dm_user_ids: []
  alexa_notification:
    target_user_id: "YOUR_DISCORD_USER_ID"
    api_token: "YOUR_GETNOTIFY_TOKEN"
    api_secret: "YOUR_GETNOTIFY_SECRET"
    endpoint_url: "https://api.getnotify.me/v1/notify"
  features:
    rss_polling_enabled: true
    home_assistant_notifier_enabled: true
    leipzig_waste_enabled: true
    alexa_notifications_enabled: true
    discord_presence_mqtt_enabled: true
    steam_presence_enabled: true
    food_service_enabled: true
    spontan_treff_enabled: true
    weekend_digest_enabled: true
    dwd_warning_enabled: true
  dwd_warning:
    postal_code: "04205"
    latitude: 51.34
    longitude: 12.36
    lead_minutes: 30
    area_names:
      - "Stadt Leipzig"
      - "Leipzig"
    events:
      - "STARKREGEN"
      - "HAGEL"
      - "GEWITTER"
      - "STURM"
      - "BÖEN"
      - "BOEEN"
      - "HEAVY_RAIN"
      - "HAIL"
      - "THUNDER"
      - "STORM"
schema:
  discord_token: str
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: str?
  steam_api_key: str?
  gemini_api_key: str?
  discord_steam_mappings:
    - discord_user_id: str
      steam_id: str
  discord_dm_user_ids:
    - str
  alexa_notification:
    target_user_id: str?
    api_token: str?
    api_secret: str?
    endpoint_url: str?
  features:
    rss_polling_enabled: bool
    home_assistant_notifier_enabled: bool
    leipzig_waste_enabled: bool
    alexa_notifications_enabled: bool
    discord_presence_mqtt_enabled: bool
    steam_presence_enabled: bool
    food_service_enabled: bool
    spontan_treff_enabled: bool
    weekend_digest_enabled: bool
    dwd_warning_enabled: bool
  dwd_warning:
    postal_code: str
    latitude: float
    longitude: float
    lead_minutes: int
    area_names:
      - str
    events:
      - str
hassio_api: true
homeassistant_api: true
hassio_role: "default"