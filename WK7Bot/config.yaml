name: "WK7 Bot"
description: "Discord Bot for Home Assistant integration and RSS feed management."
version: "1.0.91"
slug: "wk7bot"
image: "ghcr.io/devildracus/wk7bot"
ingress: true
ingress_port: 8080
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "WK7 Bot health and test API"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - config:rw
  - ssl
options:
  discord_token: ""
  test_api_enabled: false
  test_api_key: ""
  log_level: "Warning"
  startup_report_verbose: false
  weather_entity: "weather.home"
  dwd_poll_interval_minutes: 2
  leipzig_waste_ics_feed_url: ""
  pollen_region_name: "Sachsen"
  pollen_partregion_name: "Tiefland Sachsen"
  uv_city: "Leipzig"
  pollen_channel_name: "\u26c8\ufe0fweather-warnings"
  pollen_post_time: "07:00"
  metrics_enabled: true
  link_auto_write_options: true
  deal_alert_channel_name: "\U0001F3AEgame-deals"
  deal_check_interval_hours: 12
  deal_min_discount_percent: 60
  deal_watchlist_check_interval_hours: 6
  deal_watchlist_min_discount_percent: 40
  leaderboard_channel_name: "\U0001F3C6leaderboard"
  food_channel_name: "\U0001F34Efood"
  spontan_treff_channel_name: "\U0001F389spontan-treff"
  leipzig_waste_channel_name: "\U0001F5D1\U0000FE0Fleipzig-waste"
  weekend_digest_channel_name: "\U0001F4C5wochenende"
  dwd_warning_channel_name: "\U000026C8\U0000FE0Fweather-warnings"
  error_channel_name: "\U0001F916WK7Errors\U00002757"
  leaderboard_post_weekday: "Monday"
  leaderboard_post_time: "18:00"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  steam_api_key: ""
  battlenet_client_id: ""
  battlenet_client_secret: ""
  battlenet_region: "eu"
  battlenet_locale: "de_DE"
  gemini_api_key: ""
  discord_steam_mappings: []
  discord_battlenet_mappings: []
  discord_dm_user_ids: []
  error_notify_user_ids: ["162201162257399808"]
  leipzig_waste_ics_feed_url: ""
  alexa_notification:
    target_user_id: ""
    api_token: ""
    api_secret: ""
    endpoint_url: "https://api.getnotify.me/v1/notify"
  features:
    rss_polling_enabled: true
    home_assistant_notifier_enabled: true
    leipzig_waste_enabled: true
    alexa_notifications_enabled: true
    discord_presence_mqtt_enabled: true
    steam_presence_enabled: true
    battlenet_presence_enabled: true
    food_service_enabled: true
    spontan_treff_enabled: true
    weekend_digest_enabled: true
    dwd_warning_enabled: true
    error_notifications_enabled: true
    mqtt_bot_status_enabled: true
    wishlist_deal_alerts_enabled: true
    leaderboard_enabled: true
    deal_watchlist_enabled: true
    discord_events_enabled: true
    pollen_alerts_enabled: true
    reminders_enabled: true
  servers:
    wk7_server_id: "YOUR_WK7_SERVER_ID"
    test_server_id: "YOUR_BOT_TEST_SERVER_ID"
    testing_features: []                           # e.g. [ "dwd_warning", "error_notifications" ]
  dwd_warning:
    postal_code: ""
    latitude: 00.00
    longitude: 00.00
    lead_minutes: 30
    area_names:
      - "City Name"
      - "City"
    events:
      - "STARKREGEN"
      - "HAGEL"
      - "GEWITTER"
      - "STURM"
      - "BÖEN"
      - "BOEEN"
      - "HEAVY_RAIN"
      - "HAIL"
      - "THUNDER"
      - "STORM"
schema:
  discord_token: str
  test_api_enabled: bool
  test_api_key: str?
  log_level: str
  startup_report_verbose: bool
  weather_entity: str
  dwd_poll_interval_minutes: int
  pollen_region_name: str
  pollen_partregion_name: str
  uv_city: str
  pollen_channel_name: str
  pollen_post_time: str
  metrics_enabled: bool
  link_auto_write_options: bool
  deal_alert_channel_name: str
  deal_check_interval_hours: int
  deal_min_discount_percent: int
  deal_watchlist_check_interval_hours: int
  deal_watchlist_min_discount_percent: int
  leaderboard_channel_name: str
  food_channel_name: str
  spontan_treff_channel_name: str
  leipzig_waste_channel_name: str
  weekend_digest_channel_name: str
  dwd_warning_channel_name: str
  error_channel_name: str
  leaderboard_post_weekday: str
  leaderboard_post_time: str
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: str?
  steam_api_key: str?
  battlenet_client_id: str?
  battlenet_client_secret: str?
  battlenet_region: str
  battlenet_locale: str
  gemini_api_key: str?
  discord_steam_mappings:
    - discord_user_id: str
      steam_id: str
  discord_battlenet_mappings:
    - discord_user_id: str
      refresh_token: str
      region: str?
      battle_tag: str?
  discord_dm_user_ids:
    - str
  error_notify_user_ids:
    - str
  leipzig_waste_ics_feed_url: str
  alexa_notification:
    target_user_id: str?
    api_token: str?
    api_secret: str?
    endpoint_url: str?
  features:
    rss_polling_enabled: bool
    home_assistant_notifier_enabled: bool
    leipzig_waste_enabled: bool
    alexa_notifications_enabled: bool
    discord_presence_mqtt_enabled: bool
    steam_presence_enabled: bool
    battlenet_presence_enabled: bool
    food_service_enabled: bool
    spontan_treff_enabled: bool
    weekend_digest_enabled: bool
    dwd_warning_enabled: bool
    error_notifications_enabled: bool
    mqtt_bot_status_enabled: bool
    wishlist_deal_alerts_enabled: bool
    leaderboard_enabled: bool
    deal_watchlist_enabled: bool
    discord_events_enabled: bool
    pollen_alerts_enabled: bool
    reminders_enabled: bool
  servers:
    wk7_server_id: str
    test_server_id: str
    testing_features:
      - str
  dwd_warning:
    postal_code: str
    latitude: float
    longitude: float
    lead_minutes: int
    area_names:
      - str
    events:
      - str
hassio_api: true
homeassistant_api: true
hassio_role: "default"